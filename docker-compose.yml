services:
    postgres-diplom-otel:
        image: postgres:15
        container_name: postgres-diplom-otel-db
        environment:
            POSTGRES_DB: diplom_otel
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'
        volumes:
            - postgres_diplom_otel_data:/var/lib/postgresql/data

volumes:
    postgres_diplom_otel_data:
