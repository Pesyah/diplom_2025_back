services:
    postgres-diplom-studenti:
        image: postgres:15
        container_name: postgres-diplom-studenti-db
        environment:
            POSTGRES_DB: diplom_studenti
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'
        volumes:
            - postgres_diplom_studenti_data:/var/lib/postgresql/data

volumes:
    postgres_diplom_studenti_data:
