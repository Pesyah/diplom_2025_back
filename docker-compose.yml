services:
    postgres-diplom-technika:
        image: postgres:15
        container_name: postgres-diplom-technika-db
        environment:
            POSTGRES_DB: diplom_technika
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'
        volumes:
            - postgres_diplom_technika_data:/var/lib/postgresql/data

volumes:
    postgres_diplom_technika_data:
